<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#121016" />
    <title>Last Call Spike</title>
  </head>
  <body>
    <main id="stage">
      <canvas id="deck" role="img" aria-label="A station bar seen from the side, with people walking between seats"></canvas>
    </main>
    <section id="hud" aria-label="Performance">
      <h1>LAST CALL AT THE LAGRANGE: scene test</h1>
      <dl>
        <div><dt>Frames/sec</dt><dd id="fps" aria-label="Frames per second">-</dd></div>
        <div><dt>Slow frame</dt><dd id="slow">-</dd></div>
        <div><dt>Work/frame</dt><dd id="work">-</dd></div>
        <div><dt>People</dt><dd id="people">-</dd></div>
        <div><dt>Crates</dt><dd id="crates">0</dd></div>
      </dl>
      <div class="row"><span>Crowd</span><div id="population" role="group" aria-label="Crowd size"></div></div>
      <p>Tap the floor to place or remove a crate. People route around it.</p>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
