<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#121016" />
    <title>Last Call at the Lagrange</title>
  </head>
  <body>
    <main id="stage">
      <canvas id="deck" role="img" aria-label="A station bar seen from the side, with people walking between seats"></canvas>
    </main>
    <section id="hud" aria-label="Performance">
      <h1>LAST CALL AT THE LAGRANGE</h1>
      <dl>
        <div><dt>Credits</dt><dd id="money">0</dd></div>
        <div><dt>Aboard</dt><dd id="people">0</dd></div>
        <div><dt>Docked / waiting</dt><dd id="ships">0 / 0</dd></div>
        <div><dt>Served</dt><dd id="served">0</dd></div>
        <div><dt>Unhappy</dt><dd id="unhappy">0</dd></div>
        <div><dt>Scuffles</dt><dd id="scuffles">0</dd></div>
        <div><dt>Ships lost</dt><dd id="lost">0</dd></div>
        <div><dt>Frames/sec</dt><dd id="fps">-</dd></div>
      </dl>
      <p>Tap the floor to place or remove a crate. Miners and auditors do not mix.</p>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
